<header class="header">
  <a routerLink="/" class="header__logo">
    <app-logo />
  </a>

  <nav class="header__nav">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Cartelera</a>
    <a routerLink="/" fragment="proximamente">Próximamente</a>
    @if (authService.esAdmin()) {
      <a routerLink="/admin" routerLinkActive="is-active">Admin</a>
    }
  </nav>

  <div class="header__actions">
    @if (authService.cargandoSesion()) {
      <!-- evita el parpadeo botones->usuario mientras se resuelve la sesión -->
    } @else if (authService.estaLogueado()) {
      <a routerLink="/perfil" routerLinkActive="is-active" class="header__usuario">
        <i class="ph ph-user-circle"></i>
        {{ authService.perfil()?.nombre }}
        @if (authService.perfil(); as perfil) {
          <span class="header__puntos">· {{ perfil.puntos_fidelidad }} pts</span>
        }
      </a>
      <button type="button" class="btn btn--ghost" (click)="cerrarSesion()">Cerrar sesión</button>
    } @else {
      <a routerLink="/auth/login" class="btn btn--ghost">Iniciar sesión</a>
      <a routerLink="/auth/registro" class="btn btn--primary">Registrarme</a>
    }
  </div>
</header>
